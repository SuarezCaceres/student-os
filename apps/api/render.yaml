# Render Blueprint de la API de StudentOS.
#
# UBICACION: vive en apps/api/ (alcance de API-CORE). Render solo lee `render.yaml` desde la RAIZ
# del repo: el Integrador lo MOVERA (o copiara) a la raiz al crear el servicio. Las rutas ya estan
# escritas con `rootDir: apps/api`, asi que funciona tal cual desde la raiz.
#
# Alternativa sin Blueprint: crear un "Web Service" a mano con los mismos valores
# (Root Directory = apps/api, Build/Start Command, Health Check Path = /health).

services:
  - type: web
    name: student-os-api
    runtime: node
    plan: free
    # region: elige la MISMA region que el proyecto Supabase para minimizar latencia a la BD.
    rootDir: apps/api
    # Instala (incluyendo devDependencies: nest-cli/typescript/prisma hacen falta para compilar),
    # genera el cliente Prisma y compila. NO ejecuta migraciones: las aplica el Integrador a mano.
    #
    # NOTA para el Integrador: cuando exista el workspace raiz (npm workspaces + packages/shared),
    # cambia el buildCommand por:
    #   cd ../.. && npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/api && cd apps/api && npx prisma generate
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    # No despliega solo en cada push: los despliegues a produccion los aprueba el usuario.
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # PORT lo inyecta Render (10000 por defecto); no lo declares.
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # --- Secretos / especificos del entorno: se pegan en el panel de Render (nunca en el repo) ---
      - key: DATABASE_URL # pooler Supabase, puerto 6543, ...?pgbouncer=true
        sync: false
      - key: DIRECT_URL # conexion directa, puerto 5432
        sync: false
      - key: SUPABASE_URL # https://<ref>.supabase.co
        sync: false
      - key: WEB_ORIGINS # https://<tu-app>.vercel.app (lista separada por comas)
        sync: false
      # Ola 3 (agente GOOGLE). Opcionales hasta entonces.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_ENC_KEY
        sync: false
